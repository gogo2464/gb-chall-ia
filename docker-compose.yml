services:
  trade:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./roms:/app/roms:ro
    environment:
      MAX_SESSIONS: "16"
      MAX_PER_IP: "2"
      SESSION_TIMEOUT: "900"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
